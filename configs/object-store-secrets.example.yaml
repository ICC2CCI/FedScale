# Copy this file outside Git, replace every placeholder, then apply one Secret
# in the corresponding namespace. Client A/B credentials must have different
# write prefixes; only the aggregator credential may write */global.pt.
apiVersion: v1
kind: Secret
metadata:
  name: object-store-minio-root
  namespace: flower-superlink
type: Opaque
stringData:
  MINIO_ROOT_USER: REPLACE_ADMIN_USER
  MINIO_ROOT_PASSWORD: REPLACE_A_LONG_RANDOM_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: object-store-client-a
  namespace: flower-supernode-a
type: Opaque
stringData:
  S3_ENDPOINT: https://REPLACE_WITH_PRIVATE_S3_ENDPOINT
  S3_BUCKET: fl-models
  S3_ACCESS_KEY: REPLACE
  S3_SECRET_KEY: REPLACE
  S3_REGION: us-east-1
  S3_ADDRESSING_STYLE: path
  # Mounted CA bundle path for a self-signed/private MinIO TLS endpoint.
  # Omit for a public CA-signed endpoint.
  S3_CA_BUNDLE: /var/run/object-store-ca/ca.crt
  S3_CONNECT_TIMEOUT_SECONDS: "10"
  S3_READ_TIMEOUT_SECONDS: "300"
---
apiVersion: v1
kind: Secret
metadata:
  name: object-store-client-b
  namespace: flower-supernode-b
type: Opaque
stringData:
  S3_ENDPOINT: https://REPLACE_WITH_PRIVATE_S3_ENDPOINT
  S3_BUCKET: fl-models
  S3_ACCESS_KEY: REPLACE
  S3_SECRET_KEY: REPLACE
  S3_REGION: us-east-1
  S3_ADDRESSING_STYLE: path
  S3_CA_BUNDLE: /var/run/object-store-ca/ca.crt
  S3_CONNECT_TIMEOUT_SECONDS: "10"
