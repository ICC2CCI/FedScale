# Copy outside Git and replace every value with a distinct random credential.
# `object-store-minio-identities` is consumed only by the short-lived MinIO
# administration Job; individual application Secrets receive just one pair.
apiVersion: v1
kind: Secret
metadata:
  name: object-store-minio-identities
  namespace: flower-superlink
type: Opaque
stringData:
  CLIENT_A_ACCESS_KEY: REPLACE
  CLIENT_A_SECRET_KEY: REPLACE
  CLIENT_B_ACCESS_KEY: REPLACE
  CLIENT_B_SECRET_KEY: REPLACE
  SERVER_ACCESS_KEY: REPLACE
  SERVER_SECRET_KEY: REPLACE
  AGGREGATOR_ACCESS_KEY: REPLACE
  AGGREGATOR_SECRET_KEY: REPLACE
