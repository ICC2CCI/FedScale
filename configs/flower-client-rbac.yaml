# Service Account and RBAC for Flower Client to manage Kubernetes Jobs
# This allows the Client Pod to create and monitor distributed training Jobs

apiVersion: v1
kind: ServiceAccount
metadata:
  name: flower-client-sa
  namespace: flower-supernode-a
  labels:
    app: flower-client
---
# Role to allow managing Jobs, Services, and Pods
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flower-client-role
  namespace: flower-supernode-a
  labels:
    app: flower-client
rules:
# Allow managing batch Jobs
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list", "watch", "delete"]
# Allow managing Services (for headless service)
- apiGroups: [""]
  resources: ["services"]
  verbs: ["create", "get", "list", "watch", "delete"]
# Allow monitoring Pods
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
# Pod logs are a separate Kubernetes subresource.  This is needed only to
# capture diagnostics after an ephemeral distributed-training Job fails.
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
# Allow reading PVCs
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list"]
---
# Bind the Role to the ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flower-client-rolebinding
  namespace: flower-supernode-a
  labels:
    app: flower-client
subjects:
- kind: ServiceAccount
  name: flower-client-sa
  namespace: flower-supernode-a
roleRef:
  kind: Role
  name: flower-client-role
  apiGroup: rbac.authorization.k8s.io
