# STAGE-PT：0.5B FineWeb-Edu 联邦续预训练（因果 LM，非 SFT）
# 数字不进闪卡 / Dolly SFT 主表。
#
# 用法：
#   AGGREGATION_PORT_OVERRIDE=8081 NODES_FILE=deployment/nodes-pt-fineweb-0.5b.yaml \
#     RUN_CONFIG=configs/s3r12v3-fsdp-pt-fineweb-0.5b.yaml TAG=pt-fineweb-0.5b \
#     bash scripts/start_s3r12v3_fsdp_run.sh
#
# 冒烟可临时：NUM_ROUNDS_ENV=5

federated:
  num_clients: 2
  num_rounds: 20
  coverage_h: 10
  slots_per_round: 1
  seed: 20260831
  transfer_dtype: fp16
  memory_decay: 1.0
  quant_residual_decay: 1.0
  block_size: 524288
  compressor: public_random
  rho: 0.0
  always_on_threshold: 4096

train:
  objective: causal_pt
  local_steps: 30
  batch_size: 8
  grad_accum: 2
  lr: 5.0e-6
  seq_len: 1024

io:
  skip_round0_download: true
  online_eval: true
  write_full_global_every_n_rounds: 1
  client_upload_timeout_s: 1800

eval:
  eval_path: data/splits/fineweb-edu-pt/eval.jsonl
  # 0=全集（~1.7万条，约 2.5min/次）；冒烟可临时改 64
  eval_max_batches: 0
  eval_every_n_rounds: 5

sync:
  min_clients_to_aggregate: 0
  round_deadline_s: 0

security:
  auth_token: ""
  tls: false
  sec_upload_privacy: false
  secagg_enabled: true
  secagg_modulus_bits: 16
  secagg_scale: 0.0
  secagg_stochastic_rounding: true
  secagg_q_min: 0
  secagg_hadamard: true

scale:
  scale1_no_resident_global: false
  scale3_sharded_extract: false

resume:
  resume_from_round: 0

ops:
  minio_retention_recent_uploads: 0
