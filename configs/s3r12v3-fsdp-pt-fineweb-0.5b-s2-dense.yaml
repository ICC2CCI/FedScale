# STAGE-PT：0.5B FineWeb-Edu 联邦续预训练 S2 全量 FedAvg 对照
# 与 s3r12v3-fsdp-pt-fineweb-0.5b.yaml 只改：compressor=dense、coverage_h=1、关 SecAgg。
# 对照 run：202610091639（10% public_random + Windowed SecAgg）。
#
# 用法：
#   AGGREGATION_PORT_OVERRIDE=8081 NODES_FILE=deployment/nodes-pt-fineweb-0.5b.yaml \
#     RUN_CONFIG=configs/s3r12v3-fsdp-pt-fineweb-0.5b-s2-dense.yaml TAG=pt-fineweb-0.5b-s2-dense \
#     bash scripts/start_s3r12v3_fsdp_run.sh
#
# 冒烟可临时：NUM_ROUNDS_ENV=5

federated:
  num_clients: 2
  num_rounds: 20
  coverage_h: 1
  slots_per_round: 1
  seed: 20260831
  transfer_dtype: fp16
  memory_decay: 1.0
  quant_residual_decay: 1.0
  block_size: 524288
  compressor: dense
  rho: 0.0
  always_on_threshold: 4096

train:
  objective: causal_pt
  packing: true
  local_steps: 200
  batch_size: 8
  grad_accum: 2
  lr: 5.0e-6
  seq_len: 1024

io:
  skip_round0_download: true
  online_eval: true
  write_full_global_every_n_rounds: 1
  client_upload_timeout_s: 3600

eval:
  eval_path: data/splits/fineweb-edu-pt/eval.jsonl
  eval_max_batches: 0
  eval_every_n_rounds: 2

sync:
  min_clients_to_aggregate: 0
  round_deadline_s: 0

security:
  auth_token: ""
  tls: false
  sec_upload_privacy: false
  secagg_enabled: false
  secagg_modulus_bits: 16
  secagg_scale: 0.0
  secagg_stochastic_rounding: true
  secagg_q_min: 0
  secagg_hadamard: false

scale:
  scale1_no_resident_global: false
  scale3_sharded_extract: false

resume:
  resume_from_round: 0

ops:
  minio_retention_recent_uploads: 0
